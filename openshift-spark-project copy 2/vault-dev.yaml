apiVersion: v1
kind: Service
metadata:
  name: vault
spec:
  ports:
  - port: 8200
  selector:
    app: vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: vault
        image: quay.io/hashicorp/vault:1.13.1
        env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          value: "root-token"
        - name: VAULT_ADDR
          value: "http://0.0.0.0:8200"
        ports:
        - containerPort: 8200
