apiVersion: v1
kind: Service
metadata:
  name: mariadb-db
spec:
  ports:
  - port: 3306
  selector:
    app: mariadb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  labels:
    app: mariadb
spec:
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: registry.redhat.io/rhel8/mariadb-103:latest
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "SparkTest#2026"
        - name: MYSQL_DATABASE
          value: "SalesDB"
        ports:
        - containerPort: 3306
