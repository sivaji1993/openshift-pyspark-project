apiVersion: v1
kind: List
items:
- apiVersion: image.openshift.io/v1
  kind: ImageStream
  metadata:
    name: spark-app
- apiVersion: build.openshift.io/v1
  kind: BuildConfig
  metadata:
    name: spark-build
  spec:
    source:
      type: Binary
    strategy:
      type: Docker
      dockerStrategy:
        dockerfilePath: docker/Dockerfilejob
    output:
      to:
        kind: ImageStreamTag
        name: spark-app:latest
